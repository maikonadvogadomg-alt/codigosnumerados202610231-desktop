<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playground Code — Maikon Caldeira</title>
<style>
:root {
  --bg: #0f172a;
  --bg2: #1e293b;
  --bg3: #334155;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --accent: #a3a082;
  --accent2: #d4d0a8;
  --blue: #3b82f6;
  --green: #4ade80;
  --red: #f87171;
  --yellow: #fbbf24;
  --border: #334155;
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* Header */
.header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--bg2); border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 6px; }
.header-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.header-right { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.logo { font-weight: 800; font-size: 14px; color: var(--accent); letter-spacing: -0.5px; }
.logo small { font-size: 9px; color: var(--text2); font-weight: 400; letter-spacing: 1px; display: block; }

/* Inputs */
.title-input { background: transparent; border: 1px solid transparent; color: var(--text); font-size: 12px; padding: 4px 8px; border-radius: 6px; width: 140px; transition: border-color 0.2s; }
.title-input:focus { outline: none; border-color: var(--accent); }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border: none; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.btn-icon { padding: 6px; border-radius: 6px; background: transparent; border: none; color: var(--text2); cursor: pointer; transition: all 0.15s; }
.btn-icon:hover { background: var(--bg3); color: var(--text); }
.btn-primary { background: var(--accent); color: #000; }
.btn-primary:hover { background: var(--accent2); }
.btn-ghost { background: transparent; color: var(--text2); }
.btn-ghost:hover { background: var(--bg3); color: var(--text); }
.btn-mode { padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 700; border: 1px solid var(--border); background: transparent; color: var(--text2); cursor: pointer; }
.btn-mode.active { background: var(--accent); color: #000; border-color: var(--accent); }

/* Mode selector */
.mode-group { display: flex; gap: 2px; background: var(--bg); padding: 2px; border-radius: 8px; border: 1px solid var(--border); }

/* Tabs */
.tabs-bar { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; background: var(--bg2); border-bottom: 1px solid var(--border); }
.tabs { display: flex; gap: 2px; }
.tab { padding: 5px 12px; font-size: 11px; font-weight: 600; border: none; background: transparent; color: var(--text2); cursor: pointer; border-radius: 6px; transition: all 0.15s; }
.tab.active { background: var(--bg3); color: var(--text); }
.tab:hover:not(.active) { color: var(--text); }
.tab-info { font-size: 10px; color: var(--text2); }

/* Main layout */
.main { display: flex; flex: 1; overflow: hidden; }
.editor-panel { display: flex; flex-direction: column; width: 50%; border-right: 1px solid var(--border); transition: width 0.3s; }
.editor-panel.collapsed { width: 0; overflow: hidden; border: none; }
.editor-panel.expanded { width: 100%; }
.preview-panel { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.preview-panel.hidden { display: none; }

/* Editor */
.editor-wrap { flex: 1; position: relative; overflow: hidden; }
.editor-textarea { width: 100%; height: 100%; resize: none; background: var(--bg); color: var(--text); font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 13px; line-height: 1.6; padding: 12px 12px 12px 48px; border: none; outline: none; tab-size: 2; position: absolute; inset: 0; }
.line-numbers { position: absolute; left: 0; top: 0; bottom: 0; width: 40px; background: rgba(30,41,59,0.5); padding: 12px 6px 12px 0; text-align: right; font-family: 'Consolas', monospace; font-size: 11px; line-height: 1.6; color: var(--text2); opacity: 0.5; overflow: hidden; pointer-events: none; user-select: none; z-index: 1; }

/* Preview */
.preview-header { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--bg2); border-bottom: 1px solid var(--border); }
.preview-header .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.preview-frame { flex: 1; border: none; background: #fff; }

/* Dialog/Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.modal-overlay.open { display: flex; }
.modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 90%; max-width: 480px; max-height: 80vh; overflow-y: auto; }
.modal h3 { font-size: 16px; margin-bottom: 12px; color: var(--accent); }
.modal-close { position: absolute; top: 12px; right: 12px; }

/* Snippet list */
.snippet-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; cursor: pointer; transition: all 0.15s; }
.snippet-item:hover { border-color: var(--accent); background: var(--bg3); }
.snippet-item .name { font-size: 12px; font-weight: 600; }
.snippet-item .meta { font-size: 10px; color: var(--text2); }
.snippet-actions { display: flex; gap: 2px; }

/* Search */
.search-input { width: 100%; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 12px; margin-bottom: 12px; }
.search-input:focus { outline: none; border-color: var(--accent); }

/* Toast */
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--bg2); border: 1px solid var(--accent); border-radius: 10px; padding: 12px 20px; font-size: 12px; font-weight: 600; color: var(--accent2); z-index: 2000; transform: translateY(100px); opacity: 0; transition: all 0.3s; }
.toast.show { transform: translateY(0); opacity: 1; }

/* Responsive */
@media (max-width: 768px) {
  .main { flex-direction: column; }
  .editor-panel { width: 100% !important; height: 50%; border-right: none; border-bottom: 1px solid var(--border); }
  .editor-panel.collapsed { height: 0; }
  .editor-panel.expanded { height: 100%; }
  .preview-panel { height: 50%; }
  .hide-mobile { display: none !important; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text2); }

/* Status badge */
.status-badge { font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.status-badge.html { background: rgba(239,68,68,0.15); color: var(--red); }
.status-badge.react { background: rgba(59,130,246,0.15); color: var(--blue); }
.status-badge.python { background: rgba(251,191,36,0.15); color: var(--yellow); }
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-left">
    <div class="logo">⚡ Playground <small>Maikon Caldeira — Code Editor</small></div>
    <div class="mode-group">
      <button class="btn-mode active" id="modeHtml" onclick="switchMode('html')">🌐 HTML</button>
      <button class="btn-mode" id="modeReact" onclick="switchMode('react')">⚛️ React</button>
      <button class="btn-mode" id="modePython" onclick="switchMode('python')">🐍 Python</button>
    </div>
    <input type="text" class="title-input" id="projectTitle" value="Sem titulo" placeholder="Nome do projeto..." />
  </div>
  <div class="header-right">
    <button class="btn-icon" onclick="importFile()" title="Importar arquivo">📂</button>
    <button class="btn-icon" onclick="toggleFullscreen()" title="Tela cheia">🔳</button>
    <button class="btn-icon" onclick="copyCode()" title="Copiar código">📋</button>
    <button class="btn-icon" onclick="downloadFile()" title="Baixar">⬇️</button>
    <button class="btn btn-primary" onclick="saveToLocal()" title="Salvar no banco local">💾 Salvar</button>
    <button class="btn-icon" onclick="openSavedModal()" title="Meus códigos salvos">📁</button>
    <button class="btn-icon" onclick="resetCode()" title="Resetar">🔄</button>
    <button class="btn-icon" onclick="clearCode()" title="Limpar">🗑️</button>
    <button class="btn-icon" onclick="toggleEditor()" id="btnToggleEditor" title="Ampliar/Reduzir editor">⬜</button>
  </div>
</header>

<!-- Tabs -->
<div class="tabs-bar">
  <div class="tabs" id="tabsContainer">
    <button class="tab active" id="tabHtml" onclick="switchTab('html')">📄 HTML</button>
    <button class="tab" id="tabCss" onclick="switchTab('css')">🎨 CSS</button>
    <button class="tab" id="tabJs" onclick="switchTab('js')">⚙️ JS</button>
  </div>
  <div class="tab-info">
    <span id="lineCount">1 linhas</span>
    <span class="status-badge html" id="modeBadge">HTML</span>
  </div>
</div>

<!-- Main -->
<div class="main">
  <div class="editor-panel" id="editorPanel">
    <div class="editor-wrap">
      <div class="line-numbers" id="lineNumbers">1</div>
      <textarea class="editor-textarea" id="editor" spellcheck="false" placeholder="Cole ou digite seu código aqui..."></textarea>
    </div>
  </div>
  <div class="preview-panel" id="previewPanel">
    <div class="preview-header">
      <div class="dot"></div>
      <span style="font-size:11px;color:var(--text2);font-weight:600;">Resultado ao vivo</span>
      <span id="autoLabel" style="font-size:9px;color:var(--green);margin-left:auto;">● AUTO</span>
    </div>
    <iframe class="preview-frame" id="previewFrame" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
  </div>
</div>

<!-- Hidden file input -->
<input type="file" id="fileInput" style="display:none" accept=".html,.htm,.css,.js,.jsx,.tsx,.py,.txt,.svg,.xml" />

<!-- Modal: Saved Snippets -->
<div class="modal-overlay" id="savedModal">
  <div class="modal">
    <h3>📁 Meus Códigos Salvos</h3>
    <input type="text" class="search-input" id="searchInput" placeholder="🔍 Buscar por nome..." oninput="renderSavedList()" />
    <div id="savedList"></div>
    <div style="text-align:right;margin-top:12px;">
      <button class="btn btn-ghost" onclick="closeSavedModal()">Fechar</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ========== STATE ==========
const LS_KEY = 'playground-snippets-v2';
const AUTOSAVE_KEY = 'playground-autosave-v2';

let state = {
  mode: 'html', // html | react | python
  activeTab: 'html',
  html: `<div style="max-width:600px;margin:40px auto;padding:20px;font-family:sans-serif;">
  <h1 style="color:#333;">Bem-vindo ao HTML Playground</h1>
  <p style="color:#666;margin:16px 0;">Cole seu código HTML aqui e veja o resultado ao vivo!</p>
  <button onclick="alert('Funcionou!')" style="padding:10px 24px;font-size:16px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;">Clique aqui</button>
</div>`,
  css: '',
  js: `// Seu JavaScript aqui
console.log("Hello from Playground!");`,
  jsx: `// React Component — use o componente App
function App() {
  const [count, setCount] = React.useState(0);
  return (
    <div style={{padding:40,fontFamily:'sans-serif',textAlign:'center'}}>
      <h1>⚛️ React no Playground</h1>
      <p>Contador: <strong>{count}</strong></p>
      <button onClick={() => setCount(count + 1)} style={{padding:'10px 24px',fontSize:16,background:'#3b82f6',color:'white',border:'none',borderRadius:8,cursor:'pointer'}}>
        Incrementar
      </button>
    </div>
  );
}`,
  python: `# Python — output aparece no preview
# (Execução simulada no navegador via Pyodide)

dados = ["João Silva", "Maria Souza", "Pedro Lima"]

print("=== LISTA DE CLIENTES ===")
for i, nome in enumerate(dados, 1):
    print(f"{i}. {nome}")

print(f"\\nTotal: {len(dados)} clientes")`,
  title: 'Sem titulo',
  editorState: 'normal' // normal | collapsed | expanded
};

// Load autosave
try {
  const saved = localStorage.getItem(AUTOSAVE_KEY);
  if (saved) {
    const parsed = JSON.parse(saved);
    Object.assign(state, parsed);
  }
} catch(e) {}

// ========== DOM REFS ==========
const editor = document.getElementById('editor');
const previewFrame = document.getElementById('previewFrame');
const lineNumbers = document.getElementById('lineNumbers');
const titleInput = document.getElementById('projectTitle');
const editorPanel = document.getElementById('editorPanel');
const previewPanel = document.getElementById('previewPanel');
const fileInput = document.getElementById('fileInput');

// ========== INIT ==========
titleInput.value = state.title;
updateTabs();
loadEditorContent();
updatePreview();

// ========== EDITOR ==========
editor.addEventListener('input', () => {
  saveCurrentTab();
  updateLineNumbers();
  autoSave();
  debouncePreview();
});

editor.addEventListener('scroll', () => {
  lineNumbers.scrollTop = editor.scrollTop;
});

editor.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = start + 2;
    saveCurrentTab();
  }
});

// Paste detection
editor.addEventListener('paste', (e) => {
  setTimeout(() => {
    const content = editor.value;
    // Auto-detect mode
    if (state.activeTab === 'html' || state.mode === 'html') {
      if (/import\s+React|from\s+['"]react['"]|useState|useEffect|<[A-Z][a-zA-Z]*[\s/>]/.test(content)) {
        switchMode('react');
        state.jsx = content;
        loadEditorContent();
        showToast('⚛️ React/JSX detectado automaticamente!');
        return;
      }
      if (/^(def |class |import |from |print\(|#.*python)/im.test(content) && !content.includes('<')) {
        switchMode('python');
        state.python = content;
        loadEditorContent();
        showToast('🐍 Python detectado automaticamente!');
        return;
      }
    }
    saveCurrentTab();
    updatePreview();
  }, 50);
});

titleInput.addEventListener('input', () => {
  state.title = titleInput.value;
  autoSave();
});

// ========== FUNCTIONS ==========
let previewTimer = null;
function debouncePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(updatePreview, 400);
}

function updateLineNumbers() {
  const lines = editor.value.split('\n').length;
  document.getElementById('lineCount').textContent = lines + ' linhas';
  let nums = '';
  for (let i = 1; i <= lines; i++) nums += i + '\n';
  lineNumbers.textContent = nums;
}

function saveCurrentTab() {
  const tab = state.activeTab;
  if (state.mode === 'react' && tab === 'jsx') state.jsx = editor.value;
  else if (state.mode === 'python' && tab === 'python') state.python = editor.value;
  else if (tab === 'html') state.html = editor.value;
  else if (tab === 'css') state.css = editor.value;
  else if (tab === 'js') state.js = editor.value;
}

function loadEditorContent() {
  const tab = state.activeTab;
  if (state.mode === 'react' && tab === 'jsx') editor.value = state.jsx;
  else if (state.mode === 'python' && tab === 'python') editor.value = state.python;
  else if (tab === 'html') editor.value = state.html;
  else if (tab === 'css') editor.value = state.css;
  else if (tab === 'js') editor.value = state.js;
  else editor.value = '';
  updateLineNumbers();
}

function switchTab(tab) {
  saveCurrentTab();
  state.activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const tabEl = document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1));
  if (tabEl) tabEl.classList.add('active');
  loadEditorContent();
}

function updateTabs() {
  const container = document.getElementById('tabsContainer');
  const badge = document.getElementById('modeBadge');
  
  if (state.mode === 'html') {
    container.innerHTML = `
      <button class="tab ${state.activeTab==='html'?'active':''}" id="tabHtml" onclick="switchTab('html')">📄 HTML</button>
      <button class="tab ${state.activeTab==='css'?'active':''}" id="tabCss" onclick="switchTab('css')">🎨 CSS</button>
      <button class="tab ${state.activeTab==='js'?'active':''}" id="tabJs" onclick="switchTab('js')">⚙️ JS</button>
    `;
    badge.className = 'status-badge html';
    badge.textContent = 'HTML';
  } else if (state.mode === 'react') {
    container.innerHTML = `
      <button class="tab ${state.activeTab==='jsx'?'active':''}" id="tabJsx" onclick="switchTab('jsx')">⚛️ JSX</button>
      <button class="tab ${state.activeTab==='css'?'active':''}" id="tabCss" onclick="switchTab('css')">🎨 CSS</button>
    `;
    badge.className = 'status-badge react';
    badge.textContent = 'REACT';
  } else if (state.mode === 'python') {
    container.innerHTML = `
      <button class="tab active" id="tabPython" onclick="switchTab('python')">🐍 Python</button>
    `;
    badge.className = 'status-badge python';
    badge.textContent = 'PYTHON';
  }
}

function switchMode(mode) {
  saveCurrentTab();
  state.mode = mode;
  
  document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
  document.getElementById('mode' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
  
  if (mode === 'html') state.activeTab = 'html';
  else if (mode === 'react') state.activeTab = 'jsx';
  else if (mode === 'python') state.activeTab = 'python';
  
  updateTabs();
  loadEditorContent();
  updatePreview();
  autoSave();
}

function buildDocument() {
  if (state.mode === 'react') {
    return `<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"><\/script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"><\/script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>
<style>*{box-sizing:border-box;}body{margin:0;font-family:sans-serif;}${state.css}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo, useContext, createContext, Fragment } = React;
${state.jsx}
try {
  const _root = ReactDOM.createRoot(document.getElementById('root'));
  _root.render(<App />);
} catch(e) {
  document.getElementById('root').innerHTML = '<div style="color:red;padding:20px;font-family:monospace;white-space:pre-wrap">Erro: '+e.message+'</div>';
}
<\/script></body></html>`;
  }
  
  if (state.mode === 'python') {
    // Simulate Python execution in browser using Pyodide
    const escapedCode = state.python.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/<\/script>/g,'<\\/script>');
    return `<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
body{margin:0;background:#0f172a;color:#e2e8f0;font-family:'Consolas',monospace;padding:20px;}
#output{white-space:pre-wrap;font-size:13px;line-height:1.6;}
.loading{color:#60a5fa;}
.error{color:#f87171;}
.success{color:#4ade80;}
</style>
</head><body>
<div id="output"><span class="loading">⟳ Carregando Pyodide (Python no navegador)...</span></div>
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"><\/script>
<script>
async function main() {
  const out = document.getElementById('output');
  try {
    const pyodide = await loadPyodide();
    out.innerHTML = '';
    // Redirect stdout
    pyodide.runPython(\`
import sys
from io import StringIO
sys.stdout = StringIO()
\`);
    pyodide.runPython(\`${escapedCode}\`);
    const stdout = pyodide.runPython('sys.stdout.getvalue()');
    out.innerHTML = '<span class="success">$ python3 script.py</span>\\n' + stdout;
  } catch(e) {
    out.innerHTML = '<span class="error">Erro: ' + e.message + '</span>';
  }
}
main();
<\/script></body></html>`;
  }
  
  // HTML mode
  const lower = state.html.trim().toLowerCase();
  const isComplete = lower.includes('<!doctype') || (lower.includes('<html') && lower.includes('</html>'));
  
  if (isComplete) return state.html;
  
  return `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>${state.css}</style>
</head><body>
${state.html}
<script>${state.js}<\/script>
</body></html>`;
}

function updatePreview() {
  const doc = buildDocument();
  const blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  previewFrame.src = url;
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function autoSave() {
  try {
    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(state));
  } catch(e) {}
}

// ========== ACTIONS ==========
function copyCode() {
  const doc = buildDocument();
  navigator.clipboard.writeText(doc).then(() => showToast('📋 Código copiado!'));
}

function downloadFile() {
  let content, ext, mime;
  if (state.mode === 'python') { content = state.python; ext = 'py'; mime = 'text/plain'; }
  else if (state.mode === 'react') { content = state.jsx; ext = 'jsx'; mime = 'text/plain'; }
  else { content = buildDocument(); ext = 'html'; mime = 'text/html'; }
  
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (state.title || 'playground') + '.' + ext;
  a.click();
  URL.revokeObjectURL(url);
  showToast('⬇️ Arquivo baixado!');
}

function toggleFullscreen() {
  const doc = buildDocument();
  const blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function importFile() {
  fileInput.click();
}

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const content = ev.target.result;
    const ext = file.name.split('.').pop().toLowerCase();
    const name = file.name.replace(/\.[^.]+$/, '');
    
    if (ext === 'py') {
      switchMode('python');
      state.python = content;
    } else if (ext === 'jsx' || ext === 'tsx') {
      switchMode('react');
      state.jsx = content;
    } else if (ext === 'css') {
      state.css = content;
      if (state.mode === 'html') switchTab('css');
    } else if (ext === 'js') {
      state.js = content;
      if (state.mode === 'html') switchTab('js');
    } else {
      // HTML or other text
      const lower = content.trim().toLowerCase();
      if (lower.includes('<!doctype') || lower.includes('<html')) {
        switchMode('html');
        state.html = content;
        state.css = '';
        state.js = '';
      } else {
        state.html = content;
      }
      switchMode('html');
    }
    
    state.title = name;
    titleInput.value = name;
    loadEditorContent();
    updatePreview();
    autoSave();
    showToast('📂 Arquivo "' + file.name + '" importado!');
  };
  reader.readAsText(file);
  fileInput.value = '';
});

function toggleEditor() {
  if (state.editorState === 'normal') {
    // Expand editor (hide preview)
    state.editorState = 'expanded';
    editorPanel.classList.add('expanded');
    previewPanel.classList.add('hidden');
    document.getElementById('btnToggleEditor').textContent = '◧';
    document.getElementById('btnToggleEditor').title = 'Mostrar preview';
  } else if (state.editorState === 'expanded') {
    // Collapse editor (show only preview)
    state.editorState = 'collapsed';
    editorPanel.classList.remove('expanded');
    editorPanel.classList.add('collapsed');
    previewPanel.classList.remove('hidden');
    document.getElementById('btnToggleEditor').textContent = '◨';
    document.getElementById('btnToggleEditor').title = 'Mostrar editor';
  } else {
    // Back to normal
    state.editorState = 'normal';
    editorPanel.classList.remove('collapsed', 'expanded');
    previewPanel.classList.remove('hidden');
    document.getElementById('btnToggleEditor').textContent = '⬜';
    document.getElementById('btnToggleEditor').title = 'Ampliar/Reduzir editor';
  }
}

function clearCode() {
  if (state.mode === 'react') state.jsx = '';
  else if (state.mode === 'python') state.python = '';
  else { state.html = ''; state.css = ''; state.js = ''; }
  loadEditorContent();
  updatePreview();
  autoSave();
  showToast('🗑️ Código limpo!');
}

function resetCode() {
  if (state.mode === 'react') {
    state.jsx = `function App() {
  const [count, setCount] = React.useState(0);
  return (
    <div style={{padding:40,fontFamily:'sans-serif',textAlign:'center'}}>
      <h1>⚛️ React no Playground</h1>
      <p>Contador: <strong>{count}</strong></p>
      <button onClick={() => setCount(count + 1)} style={{padding:'10px 24px',fontSize:16,background:'#3b82f6',color:'white',border:'none',borderRadius:8,cursor:'pointer'}}>
        Incrementar
      </button>
    </div>
  );
}`;
  } else if (state.mode === 'python') {
    state.python = `# Python — output aparece no preview
dados = ["João Silva", "Maria Souza", "Pedro Lima"]
print("=== LISTA DE CLIENTES ===")
for i, nome in enumerate(dados, 1):
    print(f"{i}. {nome}")
print(f"\\nTotal: {len(dados)} clientes")`;
  } else {
    state.html = `<div style="max-width:600px;margin:40px auto;padding:20px;font-family:sans-serif;">
  <h1 style="color:#333;">Bem-vindo ao HTML Playground</h1>
  <p style="color:#666;margin:16px 0;">Cole seu código HTML aqui e veja o resultado ao vivo!</p>
  <button onclick="alert('Funcionou!')" style="padding:10px 24px;font-size:16px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;">Clique aqui</button>
</div>`;
    state.css = '';
    state.js = '';
  }
  state.title = 'Sem titulo';
  titleInput.value = 'Sem titulo';
  loadEditorContent();
  updatePreview();
  autoSave();
  showToast('🔄 Código resetado!');
}

// ========== LOCAL DB (localStorage) ==========
function getSnippets() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }
  catch { return []; }
}

function setSnippets(list) {
  localStorage.setItem(LS_KEY, JSON.stringify(list));
}

function saveToLocal() {
  const snippets = getSnippets();
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const item = {
    id,
    title: state.title || 'Sem titulo',
    mode: state.mode,
    html: state.html,
    css: state.css,
    js: state.js,
    jsx: state.jsx,
    python: state.python,
    date: new Date().toISOString()
  };
  snippets.unshift(item);
  setSnippets(snippets);
  showToast('💾 Salvo no banco local!');
}

function openSavedModal() {
  document.getElementById('savedModal').classList.add('open');
  renderSavedList();
}

function closeSavedModal() {
  document.getElementById('savedModal').classList.remove('open');
}

function renderSavedList() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const snippets = getSnippets().filter(s => s.title.toLowerCase().includes(query));
  const container = document.getElementById('savedList');
  
  if (snippets.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:var(--text2);font-size:12px;padding:20px;">Nenhum código salvo.</p>';
    return;
  }
  
  container.innerHTML = snippets.map(s => `
    <div class="snippet-item" onclick="loadSnippet('${s.id}')">
      <div>
        <div class="name">${escapeHtml(s.title)}</div>
        <div class="meta">${s.mode || 'html'} • ${new Date(s.date).toLocaleDateString('pt-BR')} ${new Date(s.date).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      <div class="snippet-actions">
        <button class="btn-icon" onclick="event.stopPropagation();renameSnippet('${s.id}')" title="Renomear">✏️</button>
        <button class="btn-icon" onclick="event.stopPropagation();deleteSnippet('${s.id}')" title="Excluir">🗑️</button>
      </div>
    </div>
  `).join('');
}

function loadSnippet(id) {
  const snippets = getSnippets();
  const s = snippets.find(x => x.id === id);
  if (!s) return;
  
  state.title = s.title;
  state.mode = s.mode || 'html';
  state.html = s.html || '';
  state.css = s.css || '';
  state.js = s.js || '';
  state.jsx = s.jsx || '';
  state.python = s.python || '';
  
  titleInput.value = state.title;
  switchMode(state.mode);
  closeSavedModal();
  showToast('📂 "' + s.title + '" carregado!');
}

function deleteSnippet(id) {
  if (!confirm('Excluir este código?')) return;
  const snippets = getSnippets().filter(s => s.id !== id);
  setSnippets(snippets);
  renderSavedList();
  showToast('🗑️ Código excluído!');
}

function renameSnippet(id) {
  const snippets = getSnippets();
  const s = snippets.find(x => x.id === id);
  if (!s) return;
  const newName = prompt('Novo nome:', s.title);
  if (newName && newName.trim()) {
    s.title = newName.trim();
    setSnippets(snippets);
    renderSavedList();
    showToast('✏️ Renomeado!');
  }
}

// ========== UTILS ==========
function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// Close modal on overlay click
document.getElementById('savedModal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('savedModal')) closeSavedModal();
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey) {
    if (e.key === 's') { e.preventDefault(); saveToLocal(); }
    if (e.key === 'Enter') { e.preventDefault(); updatePreview(); }
  }
});
</script>
</body>
