        // ═══════════════════════════════════════════════════════════════════════════════
        // INDEXEDDB - Armazenamento Local
        // ═══════════════════════════════════════════════════════════════════════════════

        const DB_NAME = &quot;sk-editor-db&quot;;
        const DB_VERSION = 1;
        const STORE_NAME = &quot;storage&quot;;

        let dbPromise = null;

        function openDB() {
            if (dbPromise) return dbPromise;
            dbPromise = new Promise((resolve, reject) =&gt; {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) =&gt; {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                req.onsuccess = (e) =&gt; resolve(e.target.result);
                req.onerror = () =&gt; { dbPromise = null; reject(req.error); };
            });
            return dbPromise;
        }

        async function idbGet(key) {
            try {
                const db = await openDB();
                return new Promise((resolve, reject) =&gt; {
                    const tx = db.transaction(STORE_NAME, &quot;readonly&quot;);
                    const req = tx.objectStore(STORE_NAME).get(key);
                    req.onsuccess = () =&gt; resolve(req.result);
                    req.onerror = () =&gt; reject(req.error);
                });
            } catch {
                return undefined;
            }
        }

        async function idbSet(key, value) {
            try {
                const db = await openDB();
                return new Promise((resolve, reject) =&gt; {
                    const tx = db.transaction(STORE_NAME, &quot;readwrite&quot;);
                    tx.objectStore(STORE_NAME).put(value, key);
                    tx.oncomplete = () =&gt; resolve();
                    tx.onerror = () =&gt; reject(tx.error);
                });
            } catch (e) {
                console.error(&quot;Erro ao salvar no IndexedDB:&quot;, e);
            }
        }

        async function idbDel(key) {
            try {
                const db = await openDB();
                return new Promise((resolve) =&gt; {
                    const tx = db.transaction(STORE_NAME, &quot;readwrite&quot;);
                    tx.objectStore(STORE_NAME).delete(key);
                    tx.oncomplete = () =&gt; resolve();
                });
            } catch (e) {
                console.error(&quot;Erro ao deletar do IndexedDB:&quot;, e);
            }
        }

        async function idbKeys() {
            try {
                const db = await openDB();
                return new Promise((resolve) =&gt; {
                    const tx = db.transaction(STORE_NAME, &quot;readonly&quot;);
                    const req = tx.objectStore(STORE_NAME).getAllKeys();
                    req.onsuccess = () =&gt; resolve(req.result || []);
                    req.onerror = () =&gt; resolve([]);
                });
            } catch {
                return [];
            }
        }

        async function idbClear() {
            try {
                const db = await openDB();
                return new Promise((resolve) =&gt; {
                    const tx = db.transaction(STORE_NAME, &quot;readwrite&quot;);
                    tx.objectStore(STORE_NAME).clear();
                    tx.oncomplete = () =&gt; resolve();
                });
            } catch (e) {
                console.error(&quot;Erro ao limpar IndexedDB:&quot;, e);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════════
        // PROJECTS STORAGE - Gerenciador de Projetos
        // ═══════════════════════════════════════════════════════════════════════════════

        const INDEX_KEY = &quot;sk-editor-projects&quot;;
        const CURRENT_KEY = &quot;sk-editor-current&quot;;
        const FILES_PREFIX = &quot;sk-proj-files-&quot;;

        function calcSize(files) {
            return Object.values(files).reduce((a, v) =&gt; a + v.length, 0);
        }

        function formatDate(ts) {
            return new Date(ts).toLocaleDateString(&quot;pt-BR&quot;, { 
                day: &quot;2-digit&quot;, month: &quot;2-digit&quot;, year: &quot;2-digit&quot;, 
                hour: &quot;2-digit&quot;, minute: &quot;2-digit&quot; 
            });
        }

        function getProjectStats(files) {
            const count = Object.keys(files).length;
            const size = Object.values(files).reduce((a, v) =&gt; a + v.length, 0);
            return { 
                count, 
                size: size &gt; 1024 ? `${(size / 1024).toFixed(1)} KB` : `${size} B` 
            };
        }

        function saveProjectFiles(id, files) {
            const key = FILES_PREFIX + id;
            idbSet(key, files).catch(() =&gt; {});
            try {
                localStorage.setItem(key, JSON.stringify(files));
            } catch {
                try {
                    const trimmed = {};
                    for (const [k, v] of Object.entries(files)) {
                        if (v.length &lt; 100_000) trimmed[k] = v;
                    }
                    localStorage.setItem(key, JSON.stringify(trimmed));
                } catch { }
            }
        }

        function loadProjectFiles(id) {
            try {
                const raw = localStorage.getItem(FILES_PREFIX + id);
                return raw ? JSON.parse(raw) : {};
            } catch { 
                return {}; 
            }
        }

        function loadIndex() {
            try {
                const raw = localStorage.getItem(INDEX_KEY);
                if (!raw) return [];
                return JSON.parse(raw);
            } catch { 
                return []; 
            }
        }

        function saveIndex(projects) {
            try {
                localStorage.setItem(INDEX_KEY, JSON.stringify(projects));
            } catch {
                try {
                    const slim = projects.slice().sort((a, b) =&gt; b.updatedAt - a.updatedAt).slice(0, 10);
                    localStorage.setItem(INDEX_KEY, JSON.stringify(slim));
                } catch { }
            }
        }

        function createProject(name, files = {}) {
            return {
                id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
                name,
                files,
                createdAt: Date.now(),
                updatedAt: Date.now()
            };
        }

        function saveProjects(projects) {
            for (const p of projects) {
                saveProjectFiles(p.id, p.files);
            }
            saveIndex(projects);
            updateStats();
        }

        function loadProjects() {
            try {
                const index = loadIndex();
                return index.map(p =&gt; ({
                    ...p,
                    files: loadProjectFiles(p.id)
                }));
            } catch { 
                return []; 
            }
        }

        function getCurrentProjectId() {
            return localStorage.getItem(CURRENT_KEY);
        }

        function setCurrentProjectId(id) {
            if (id) localStorage.setItem(CURRENT_KEY, id);
            else localStorage.removeItem(CURRENT_KEY);
        }

        // ═══════════════════════════════════════════════════════════════════════════════
        // INTERFACE - Controle de Abas
        // ═══════════════════════════════════════════════════════════════════════════════

        let currentProject = null;

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab =&gt; {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn =&gt; {
                btn.classList.remove('active');
            });

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function showAlert(message, type = 'info', elementId = null) {
            const alertHtml = `&lt;div class=&quot;alert ${type}&quot;&gt;
                &lt;span&gt;${type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️'}&lt;/span&gt;
                &lt;div&gt;${message}&lt;/div&gt;
            &lt;/div&gt;`;

            if (elementId) {
                document.getElementById(elementId).innerHTML = alertHtml;
            }
        }

        function updateProjectList() {
            const projects = loadProjects();
            const listDiv = document.getElementById('projectList');
            const currentId = getCurrentProjectId();

            if (projects.length === 0) {
                listDiv.innerHTML = '&lt;p style=&quot;color: #666; text-align: center; padding: 20px;&quot;&gt;Nenhum projeto&lt;/p&gt;';
                return;
            }

            listDiv.innerHTML = projects.map(p =&gt; {
                const stats = getProjectStats(p.files);
                const isActive = p.id === currentId;
                return `
                    &lt;div class=&quot;project-item ${isActive ? 'active' : ''}&quot; onclick=&quot;selectProject('${p.id}')&quot;&gt;
                        &lt;div class=&quot;project-name&quot;&gt;${p.name}&lt;/div&gt;
                        &lt;div class=&quot;project-meta&quot;&gt;
                            📄 ${stats.count} | 📦 ${stats.size}
                        &lt;/div&gt;
                    &lt;/div&gt;
                `;
            }).join('');

            document.getElementById('projectCount').textContent = projects.length;
        }

        function selectProject(id) {
            const projects = loadProjects();
            currentProject = projects.find(p =&gt; p.id === id);
            
            if (currentProject) {
                setCurrentProjectId(id);
                updateProjectList();
                updateProjectInfo();
                updateFilesList();
                document.getElementById('projectName').value = currentProject.name;
                document.getElementById('connString').value = currentProject.files['connection-string'] || '';
            }
        }

        function updateProjectInfo() {
            if (!currentProject) {
                document.getElementById('projectInfo').innerHTML = '&lt;p style=&quot;color: #888; text-align: center; padding: 20px;&quot;&gt;Selecione um projeto&lt;/p&gt;';
                return;
            }

            const stats = getProjectStats(currentProject.files);
            document.getElementById('projectInfo').innerHTML = `
                &lt;div class=&quot;alert info&quot;&gt;
                    &lt;span&gt;ℹ️&lt;/span&gt;
                    &lt;div&gt;
                        &lt;strong&gt;${currentProject.name}&lt;/strong&gt;&lt;br&gt;
                        Criado: ${formatDate(currentProject.createdAt)}&lt;br&gt;
                        Atualizado: ${formatDate(currentProject.updatedAt)}&lt;br&gt;
                        Arquivos: ${stats.count} | Tamanho: ${stats.size}
                    &lt;/div&gt;
                &lt;/div&gt;
            `;

            document.getElementById('statFiles').textContent = stats.count;
            document.getElementById('statSize').textContent = stats.size;
            document.getElementById('statCreated').textContent = formatDate(currentProject.createdAt);
            document.getElementById('statUpdated').textContent = formatDate(currentProject.updatedAt);
        }

        function updateFilesList() {
            if (!currentProject) return;

            const filesDiv = document.getElementById('filesList');
            const files = currentProject.files;
            const fileNames = Object.keys(files).filter(k =&gt; !k.startsWith('connection-'));

            if (fileNames.length === 0) {
                filesDiv.innerHTML = '&lt;p style=&quot;color: #888; text-align: center; padding: 20px;&quot;&gt;Nenhum arquivo&lt;/p&gt;';
                return;
            }

            filesDiv.innerHTML = `
                &lt;table class=&quot;table&quot;&gt;
                    &lt;thead&gt;
                        &lt;tr&gt;
                            &lt;th&gt;Nome&lt;/th&gt;
                            &lt;th&gt;Tamanho&lt;/th&gt;
                            &lt;th&gt;Ação&lt;/th&gt;
                        &lt;/tr&gt;
                    &lt;/thead&gt;
                    &lt;tbody&gt;
                        ${fileNames.map(name =&gt; `
                            &lt;tr&gt;
                                &lt;td&gt;${name}&lt;/td&gt;
                                &lt;td&gt;${(files[name].length / 1024).toFixed(1)} KB&lt;/td&gt;
                                &lt;td&gt;
                                    &lt;button onclick=&quot;viewFile('${name}')&quot; style=&quot;padding: 6px 12px; font-size: 10px;&quot;&gt;👁 Ver&lt;/button&gt;
                                    &lt;button onclick=&quot;deleteFile('${name}')&quot; style=&quot;padding: 6px 12px; font-size: 10px;&quot; class=&quot;danger&quot;&gt;🗑️&lt;/button&gt;
                                &lt;/td&gt;
                            &lt;/tr&gt;
                        `).join('')}
                    &lt;/tbody&gt;
                &lt;/table&gt;
            `;
        }

        function updateStats() {
            const projects = loadProjects();
            let totalSize = 0;
            for (const p of projects) {
                totalSize += calcSize(p.files);
            }
            document.getElementById('storageSize').textContent = (totalSize / 1024).toFixed(1) + ' KB';
        }

        // ═══════════════════════════════════════════════════════════════════════════════
        // PROJETOS
        // ═══════════════════════════════════════════════════════════════════════════════

        function showNewProjectForm() {
            const name = prompt('Nome do novo projeto:');
            if (!name) return;

            const projects = loadProjects();
            const newProject = createProject(name);
            projects.push(newProject);
            saveProjects(projects);
            selectProject(newProject.id);
            showAlert('✅ Projeto criado!', 'success', 'projectInfo');
        }

        function updateProjectName() {
            if (!currentProject) {
                showAlert('❌ Selecione um projeto!', 'error', 'settingsResult');
                return;
            }

            const newName = document.getElementById('projectName').value.trim();
            if (!newName) {
                showAlert('❌ Digite um nome!', 'error', 'settingsResult');
                return;
            }

            const projects = loadProjects();
            const idx = projects.findIndex(p =&gt; p.id === currentProject.id);
            if (idx &gt;= 0) {
                projects[idx].name = newName;
                projects[idx].updatedAt = Date.now();
                saveProjects(projects);
                currentProject.name = newName;
                updateProjectList();
                showAlert('✅ Nome atualizado!', 'success', 'settingsResult');
            }
        }

        function duplicateCurrentProject() {
            if (!currentProject) {
                showAlert('❌ Selecione um projeto!', 'error', 'settingsResult');
                return;
            }

            const projects = loadProjects();
            const copy = createProject(currentProject.name + ' (cópia)', JSON.parse(JSON.stringify(currentProject.files)));
            projects.push(copy);
            saveProjects(projects);
            selectProject(copy.id);
            showAlert('✅ Projeto duplicado!', 'success', 'settingsResult');
        }

        function deleteCurrentProject() {
            if (!currentProject) {
                showAlert('❌ Selecione um projeto!', 'error', 'settingsResult');
                return;
            }

            if (!confirm(`⚠️ Tem certeza que quer deletar &quot;${currentProject.name}&quot;?`)) return;

            const projects = loadProjects().filter(p =&gt; p.id !== currentProject.id);
            saveProjects(projects);
            idbDel(FILES_PREFIX + currentProject.id);
            currentProject = null;
            setCurrentProjectId(null);
            updateProjectList();
            updateProjectInfo();
            showAlert('✅ Projeto deletado!', 'success', 'settingsResult');
        }

        function exportCurrentProject() {
            if (!currentProject) {
                showAlert('❌ Selecione um projeto!', 'error', 'settingsResult');
                return;
            }

            const json = JSON.stringify(currentProject, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentProject.name}-${Date.now()}.json`;
            a.click();
            showAlert('✅ Projeto exportado!', 'success', 'settingsResult');
        }

        function exportAllProjects() {
            const projects = loadProjects();
            const json = JSON.stringify(projects, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `projetos-backup-${Date.now()}.json`;
            a.click();
        }

        // ═══════════════════════════════════════════════════════════════════════════════
        // ARQUIVOS
        // ═══════════════════════════════════════════════════════════════════════════════

        function addFileToProject() {
            if (!currentProject) {
                showAlert('❌ Selecione um projeto!', 'error', 'fileResult');
                return;
            }

            const name = document.getElementById('fileName').value.trim();
            const content = document.getElementById('fileContent').value;

            if (!name || !content) {
                showAlert('❌ Preencha nome e conteúdo!', 'error', 'fileResult');
                return;
            }

            currentProject.files[name] = content;
            currentProject.updatedAt = Date.now();

            const projects = loadProjects();
            const idx = projects.findIndex(p =&gt; p.id === currentProject.id);
            if (idx &gt;= 0) {
                projects[idx] = currentProject;
                saveProjects(projects);
            }

            clearFileForm();
            updateFilesList();
            showAlert(`✅ Arquivo &quot;${name}&quot; adicionado!`, 'success', 'fileResult');
        }

        function viewFile(name) {
            if (!currentProject) return;
            document.getElementById('fileName').value = name;
            document.getElementById('fileContent').value = currentProject.files[name];
            switchTab('files');
        }

        function deleteFile(name) {
            if (!currentProject) return;
            if (!confirm(`Deletar &quot;${name}&quot;?`)) return;

            delete currentProject.files[name];
            currentProject.updatedAt = Date.now();

            const projects = loadProjects();
            const idx = projects.findIndex(p =&gt; p.id === currentProject.id);
            if (idx &gt;= 0) {
                projects[idx] = currentProject;
                saveProjects(projects);
            }

            updateFilesList();
            showAlert(`✅ Arquivo deletado!`, 'success', 'fileResult');
        }

        function clearFileForm() {
            document.getElementById('fileName').value = '';
            document.getElementById('fileContent').value = '';
        }

        // ═══════════════════════════════════════════════════════════════════════════════
        // BANCO DE DADOS
        // ═══════════════════════════════════════════════════════════════════════════════

        function toggleConnVisibility() {
            const input = document.getElementById('connString');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function testConnection() {
            const connStr = document.getElementById('connString').value.trim();
            const resultDiv = document.getElementById('testResult');

            if (!connStr) {
                showAlert('❌ Cole a string de conexão!', 'error', 'testResult');
                return;
            }

            showAlert('⏳ Testando...', 'info', 'testResult');

            if (connStr.includes('postgresql://')) {
                showAlert('✅ String válida! (Conectar requer backend Node.js)', 'success', 'testResult');
            } else {
                showAlert('❌ String inválida!', 'error', 'testResult');
            }
        }

        function saveConnectionToProject() {
            if (!currentProject) {
                showAlert('❌ Selecione um projeto!', 'error', 'testResult');
                return;
            }

            const connStr = document.getElementById('connString').value.trim();
            if (!connStr) {
                showAlert('❌ Cole a string de conexão!', 'error', 'testResult');
                return;
            }

            currentProject.files['connection-string'] = connStr;
            currentProject.updatedAt = Date.now();

            const projects = loadProjects();
            const idx = projects.findIndex(p =&gt; p.id === currentProject.id);
            if (idx &gt;= 0) {
                projects[idx] = currentProject;
                saveProjects(projects);
            }

            showAlert('✅ Conexão salva no projeto!', 'success', 'testResult');
        }

        function runQuery() {
            const sql = document.getElementById('sqlInput').value.trim();
            if (!sql) {
                showAlert('❌ Digite um SQL!', 'error', 'queryResult');
                return;
            }

            showAlert('⏳ Executando...', 'info', 'queryResult');
            setTimeout(() =&gt; {
                showAlert('⚠️ Requer backend Node.js para executar de verdade', 'info', 'queryResult');
            }, 500);
        }

        function clearQuery() {
            document.getElementById('sqlInput').value = '';
        }

        function createJuridicalTable(type) {
            const tables = {
                clientes: `CREATE TABLE IF NOT EXISTS clientes (
    id SERIAL PRIMARY KEY,
    nome VARCHAR(200) NOT NULL,
    cpf VARCHAR(14) UNIQUE,
    email VARCHAR(150),
    telefone VARCHAR(20),
    celular VARCHAR(20),
    endereco TEXT,
    cidade VARCHAR(100),
    estado CHAR(2),
    data_nascimento DATE,
    observacoes TEXT,
    ativo BOOLEAN DEFAULT true,
    criado_em TIMESTAMP DEFAULT NOW(),
    atualizado_em TIMESTAMP DEFAULT NOW()
);`,
                processos: `CREATE TABLE IF NOT EXISTS processos (
    id SERIAL PRIMARY KEY,
    numero_processo VARCHAR(50) UNIQUE NOT NULL,
    cliente_id INTEGER REFERENCES clientes(id),
    tipo VARCHAR(50),
    area_direito VARCHAR(50),
    vara VARCHAR(100),
    comarca VARCHAR(100),
    tribunal VARCHAR(100),
    fase VARCHAR(50) DEFAULT 'inicial',
    status VARCHAR(30) DEFAULT 'ativo',
    polo_ativo TEXT,
    polo_passivo TEXT,
    objeto TEXT,
    valor_causa DECIMAL(15,2),
    data_distribuicao DATE,
    data_prazo DATE,
    observacoes TEXT,
    criado_em TIMESTAMP DEFAULT NOW(),
    atualizado_em TIMESTAMP DEFAULT NOW()
);`,
                audiencias: `CREATE TABLE IF NOT EXISTS audiencias (
    id SERIAL PRIMARY KEY,
    processo_id INTEGER REFERENCES processos(id),
    tipo VARCHAR(80),
    data_hora TIMESTAMP NOT NULL,
    local VARCHAR(200),
    juiz VARCHAR(150),
    pauta TEXT,
    resultado TEXT,
    status VARCHAR(20) DEFAULT 'agendada',
    criado_em TIMESTAMP DEFAULT NOW()
);`,
                prazos: `CREATE TABLE IF NOT EXISTS prazos (
    id SERIAL PRIMARY KEY,
    processo_id INTEGER REFERENCES processos(id),
    descricao TEXT NOT NULL,
    data_limite DATE NOT NULL,
    tipo VARCHAR(50),
    concluido BOOLEAN DEFAULT false,
    criado_em TIMESTAMP DEFAULT NOW()
);`
            };

            document.getElementById('sqlInput').value = tables[type] || '';
            showAlert(`✅ SQL para &quot;${type}&quot; carregado!`, 'success', 'juridicalResult');
        }

        // ═══════════════════════════════════════════════════════════════════════════════
        // ARMAZENAMENTO
        // ═══════════════════════════════════════════════════════════════════════════════

        async function refreshStorageInfo() {
            const keys = await idbKeys();
            const tbody = document.getElementById('storageTable');

            if (keys.length === 0) {
                tbody.innerHTML = '&lt;tr&gt;&lt;td colspan=&quot;3&quot; style=&quot;text-align: center; color: #666;&quot;&gt;Vazio&lt;/td&gt;&lt;/tr&gt;';
                return;
            }

            let html = '';
            for (const key of keys) {
                const value = await idbGet(key);
                const size = JSON.stringify(value).length;
                html += `
                    &lt;tr&gt;
                        &lt;td&gt;${key}&lt;/td&gt;
                        &lt;td&gt;${(size / 1024).toFixed(1)} KB&lt;/td&gt;
                        &lt;td&gt;&lt;button onclick=&quot;idbDel('${key}'); refreshStorageInfo();&quot; style=&quot;padding: 6px 12px; font-size: 10px;&quot; class=&quot;danger&quot;&gt;🗑️&lt;/button&gt;&lt;/td&gt;
                    &lt;/tr&gt;
                `;
            }
            tbody.innerHTML = html;
        }

        async function clearAllStorage() {
            if (!confirm('⚠️ Deletar TUDO?')) return;
            await idbClear();
            localStorage.clear();
            location.reload();
        }

        // ═══════════════════════════════════════════════════════════════════════════════
        // INICIALIZAÇÃO
        // ═══════════════════════════════════════════════════════════════════════════════

        window.addEventListener('load', async () =&gt; {
            updateProjectList();
            updateStats();
            refreshStorageInfo();

            const currentId = getCurrentProjectId();
            if (currentId) {
                selectProject(currentId);
            }

            // Atalho: Ctrl+Enter para executar query
            document.getElementById('sqlInput').addEventListener('keydown', (e) =&gt; {
                if (e.key === 'Enter' &amp;&amp; (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    runQuery();
                }
            });
        });
    &lt;/script&gt;
&lt;/body&gt;

            color: #888;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: #2d4a1e;
            border-color: #7ec87a;
            color: #7ec87a;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .panel {
            background: #0d1309;
            border: 1px solid #2d4a1e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            color: #7ec87a;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            background: #0a0f07;
            border: 1px solid #2d4a1e;
            border-radius: 8px;
            color: #a8d5a2;
            font-family: 'Monaco', monospace;
            font-size: 12px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #7ec87a;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            background: #2d4a1e;
            border: 1px solid #7ec87a;
            border-radius: 8px;
            color: #7ec87a;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.3s;
        }

        button:hover {
            background: #3d5a2e;
        }

        button.danger {
            background: #3a1a1a;
            border-color: #5a2d2d;
            color: #ff6b6b;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert.success {
            background: #1a3a1a;
            border: 1px solid #2d5a2d;
            color: #7ec87a;
        }

        .alert.error {
            background: #3a1a1a;
            border: 1px solid #5a2d2d;
            color: #ff6b6b;
        }

        .alert.info {
            background: #1a2a3a;
            border: 1px solid #2d4a5a;
            color: #6ba3d5;
        }

        .file-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .file-card {
            background: #141c0d;
            border: 1px solid #2d4a1e;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-card:hover {
            border-color: #7ec87a;
            background: #1a2a1a;
        }

        .file-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .file-name {
            font-weight: bold;
            color: #a8d5a2;
            margin-bottom: 5px;
            word-break: break-word;
        }

        .file-info {
            font-size: 10px;
            color: #666;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #141c0d;
            border: 1px solid #2d4a1e;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #2d4a1e, #7ec87a);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #fff;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 11px;
            background: #0a0f07;
            border: 1px solid #2d4a1e;
            border-radius: 8px;
            overflow: hidden;
        }

        .table th {
            background: #141c0d;
            color: #7ec87a;
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #2d4a1e;
            font-weight: bold;
        }

        .table td {
            padding: 10px;
            border-bottom: 1px solid #2d4a1e;
            color: #a8d5a2;
        }

        .table tr:hover {
            background: #0d1309;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #0d1309;
            border: 1px solid #2d4a1e;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            color: #7ec87a;
            margin-bottom: 20px;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #888;
            font-size: 20px;
            cursor: pointer;
        }
    &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;div class=&quot;container&quot;&gt;
        &lt;!-- HEADER --&gt;
        &lt;div class=&quot;header&quot;&gt;
            &lt;div class=&quot;header-left&quot;&gt;
                &lt;span style=&quot;font-size: 36px;&quot;&gt;⚖️&lt;/span&gt;
                &lt;div&gt;
                    &lt;div class=&quot;header-title&quot;&gt;Sistema Jurídico Pro&lt;/div&gt;
                    &lt;div style=&quot;font-size: 12px; color: #888;&quot;&gt;Import/Export Avançado&lt;/div&gt;
                &lt;/div&gt;
            &lt;/div&gt;
            &lt;div style=&quot;text-align: right;&quot;&gt;
                &lt;div style=&quot;font-size: 12px; color: #888;&quot;&gt;Projetos: &lt;strong id=&quot;projectCount&quot;&gt;0&lt;/strong&gt;&lt;/div&gt;
                &lt;div style=&quot;font-size: 12px; color: #888;&quot;&gt;Backups: &lt;strong id=&quot;backupCount&quot;&gt;0&lt;/strong&gt;&lt;/div&gt;
            &lt;/div&gt;
        &lt;/div&gt;

        &lt;!-- TABS --&gt;
        &lt;div class=&quot;tabs&quot;&gt;
            &lt;button class=&quot;tab-btn active&quot; onclick=&quot;switchTab('projects')&quot;&gt;📁 Projetos&lt;/button&gt;
            &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab('export')&quot;&gt;⬇️ Exportar&lt;/button&gt;
            &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab('import')&quot;&gt;⬆️ Importar&lt;/button&gt;
            &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab('backups')&quot;&gt;💾 Backups&lt;/button&gt;
        &lt;/div&gt;

        &lt;!-- ABA 1: Projetos --&gt;
        &lt;div id=&quot;projects&quot; class=&quot;tab-content active&quot;&gt;
            &lt;div class=&quot;panel&quot;&gt;
                &lt;h2 style=&quot;margin-bottom: 15px; color: #7ec87a;&quot;&gt;📁 Meus Projetos&lt;/h2&gt;

                &lt;div class=&quot;button-group&quot; style=&quot;margin-bottom: 20px;&quot;&gt;
                    &lt;button onclick=&quot;showNewProjectModal()&quot;&gt;➕ Novo Projeto&lt;/button&gt;
                    &lt;button onclick=&quot;switchTab('export')&quot;&gt;⬇️ Exportar Tudo&lt;/button&gt;
                    &lt;button onclick=&quot;switchTab('import')&quot;&gt;⬆️ Importar&lt;/button&gt;
                &lt;/div&gt;

                &lt;div class=&quot;file-list&quot; id=&quot;projectsList&quot;&gt;
                    &lt;p style=&quot;color: #888; grid-column: 1/-1; text-align: center; padding: 40px;&quot;&gt;Nenhum projeto criado&lt;/p&gt;
                &lt;/div&gt;
            &lt;/div&gt;
        &lt;/div&gt;

        &lt;!-- ABA 2: Exportar --&gt;
        &lt;div id=&quot;export&quot; class=&quot;tab-content&quot;&gt;
            &lt;div class=&quot;panel&quot;&gt;
                &lt;h2 style=&quot;margin-bottom: 15px; color: #7ec87a;&quot;&gt;⬇️ Exportar Projetos&lt;/h2&gt;

                &lt;p style=&quot;color: #888; margin-bottom: 15px; font-size: 12px;&quot;&gt;
                    Escolha o que exportar e salve como arquivo .json para backup ou compartilhamento.
                &lt;/p&gt;

                &lt;div class=&quot;form-group&quot;&gt;
                    &lt;label&gt;O que deseja exportar?&lt;/label&gt;
                    &lt;select id=&quot;exportType&quot;&gt;
                        &lt;option value=&quot;all&quot;&gt;📦 Todos os projetos + configurações&lt;/option&gt;
                        &lt;option value=&quot;projects&quot;&gt;📁 Apenas projetos&lt;/option&gt;
                        &lt;option value=&quot;selected&quot;&gt;🎯 Projeto selecionado&lt;/option&gt;
                        &lt;option value=&quot;backup&quot;&gt;💾 Backup completo (com histórico)&lt;/option&gt;
                    &lt;/select&gt;
                &lt;/div&gt;

                &lt;div class=&quot;form-group&quot;&gt;
                    &lt;label&gt;Incluir dados sensíveis?&lt;/label&gt;
                    &lt;select id=&quot;exportSensitive&quot;&gt;
                        &lt;option value=&quot;false&quot;&gt;❌ Não (sem credenciais)&lt;/option&gt;
                        &lt;option value=&quot;true&quot;&gt;✅ Sim (com credenciais)&lt;/option&gt;
                    &lt;/select&gt;
                &lt;/div&gt;

                &lt;div class=&quot;form-group&quot;&gt;
                    &lt;label&gt;Formato&lt;/label&gt;
                    &lt;select id=&quot;exportFormat&quot;&gt;
                        &lt;option value=&quot;json&quot;&gt;📄 JSON (recomendado)&lt;/option&gt;
                        &lt;option value=&quot;csv&quot;&gt;📊 CSV (para Excel)&lt;/option&gt;
                        &lt;option value=&quot;sql&quot;&gt;🗄️ SQL (para banco de dados)&lt;/option&gt;
                    &lt;/select&gt;
                &lt;/div&gt;

                &lt;div class=&quot;button-group&quot;&gt;
                    &lt;button onclick=&quot;performExport()&quot;&gt;⬇️ Exportar Agora&lt;/button&gt;
                    &lt;button onclick=&quot;previewExport()&quot;&gt;👁 Visualizar&lt;/button&gt;
                &lt;/div&gt;

                &lt;div id=&quot;exportResult&quot;&gt;&lt;/div&gt;
            &lt;/div&gt;

            &lt;div class=&quot;panel&quot;&gt;
                &lt;h2 style=&quot;margin-bottom: 15px; color: #7ec87a;&quot;&gt;📋 Histórico de Exportações&lt;/h2&gt;
                &lt;table class=&quot;table&quot;&gt;
                    &lt;thead&gt;
                        &lt;tr&gt;
                            &lt;th&gt;Data&lt;/th&gt;
                            &lt;th&gt;Tipo&lt;/th&gt;
                            &lt;th&gt;Tamanho&lt;/th&gt;
                            &lt;th&gt;Ação&lt;/th&gt;
                        &lt;/tr&gt;
                    &lt;/thead&gt;
                    &lt;tbody id=&quot;exportHistory&quot;&gt;
                        &lt;tr&gt;&lt;td colspan=&quot;4&quot; style=&quot;text-align: center; color: #666;&quot;&gt;Nenhuma exportação&lt;/td&gt;&lt;/tr&gt;
                    &lt;/tbody&gt;
                &lt;/table&gt;
            &lt;/div&gt;
        &lt;/div&gt;

        &lt;!-- ABA 3: Importar --&gt;
        &lt;div id=&quot;import&quot; class=&quot;tab-content&quot;&gt;
            &lt;div class=&quot;panel&quot;&gt;
                &lt;h2 style=&quot;margin-bottom: 15px; color: #7ec87a;&quot;&gt;⬆️ Importar Projetos&lt;/h2&gt;

                &lt;p style=&quot;color: #888; margin-bottom: 15px; font-size: 12px;&quot;&gt;
                    Carregue um arquivo .json exportado anteriormente para restaurar seus projetos.
                &lt;/p&gt;

                &lt;div class=&quot;form-group&quot;&gt;
                    &lt;label&gt;Selecione o arquivo&lt;/label&gt;
                    &lt;input type=&quot;file&quot; id=&quot;importFile&quot; accept=&quot;.json,.csv,.sql&quot; onchange=&quot;previewImport()&quot;&gt;
                &lt;/div&gt;

                &lt;div id=&quot;importPreview&quot; style=&quot;display: none;&quot;&gt;
                    &lt;div class=&quot;alert info&quot;&gt;
                        &lt;span&gt;ℹ️&lt;/span&gt;
                        &lt;div&gt;
                            &lt;strong&gt;Arquivo selecionado:&lt;/strong&gt; &lt;span id=&quot;importFileName&quot;&gt;&lt;/span&gt;&lt;br&gt;
                            &lt;strong&gt;Tamanho:&lt;/strong&gt; &lt;span id=&quot;importFileSize&quot;&gt;&lt;/span&gt;&lt;br&gt;
                            &lt;strong&gt;Projetos encontrados:&lt;/strong&gt; &lt;span id=&quot;importProjectCount&quot;&gt;0&lt;/span&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;

                    &lt;div class=&quot;form-group&quot;&gt;
                        &lt;label&gt;O que fazer com duplicatas?&lt;/label&gt;
                        &lt;select id=&quot;importMerge&quot;&gt;
                            &lt;option value=&quot;replace&quot;&gt;🔄 Substituir (sobrescrever)&lt;/option&gt;
                            &lt;option value=&quot;merge&quot;&gt;🔀 Mesclar (combinar)&lt;/option&gt;
                            &lt;option value=&quot;rename&quot;&gt;📝 Renomear (adicionar como novo)&lt;/option&gt;
                        &lt;/select&gt;
                    &lt;/div&gt;

                    &lt;div class=&quot;button-group&quot;&gt;
                        &lt;button onclick=&quot;performImport()&quot;&gt;⬆️ Importar Agora&lt;/button&gt;
                        &lt;button onclick=&quot;cancelImport()&quot;&gt;❌ Cancelar&lt;/button&gt;
                    &lt;/div&gt;
                &lt;/div&gt;

                &lt;div id=&quot;importResult&quot;&gt;&lt;/div&gt;
            &lt;/div&gt;

            &lt;div class=&quot;panel&quot;&gt;
                &lt;h2 style=&quot;margin-bottom: 15px; color: #7ec87a;&quot;&gt;📚 Exemplos de Importação&lt;/h2&gt;

                &lt;p style=&quot;color: #888; margin-bottom: 15px; font-size: 12px;&quot;&gt;
                    Clique em um exemplo para carregar um arquivo de teste:
                &lt;/p&gt;

                &lt;div class=&quot;button-group&quot;&gt;
                    &lt;button onclick=&quot;loadExampleProject()&quot;&gt;📋 Exemplo: Cliente&lt;/button&gt;
                    &lt;button onclick=&quot;loadExampleBackup()&quot;&gt;💾 Exemplo: Backup&lt;/button&gt;
                    &lt;button onclick=&quot;loadExampleBatch()&quot;&gt;📦 Exemplo: Lote&lt;/button&gt;
                &lt;/div&gt;
            &lt;/div&gt;
        &lt;/div&gt;

        &lt;!-- ABA 4: Backups --&gt;
        &lt;div id=&quot;backups&quot; class=&quot;tab-content&quot;&gt;
            &lt;div class=&quot;panel&quot;&gt;
                &lt;h2 style=&quot;margin-bottom: 15px; color: #7ec87a;&quot;&gt;💾 Gerenciar Backups&lt;/h2&gt;

                &lt;p style=&quot;color: #888; margin-bottom: 15px; font-size: 12px;&quot;&gt;
                    Crie, restaure e gerencie backups automáticos de seus projetos.
                &lt;/p&gt;

                &lt;div class=&quot;button-group&quot; style=&quot;margin-bottom: 20px;&quot;&gt;
                    &lt;button onclick=&quot;createBackup()&quot;&gt;➕ Criar Backup Agora&lt;/button&gt;
                    &lt;button onclick=&quot;scheduleAutoBackup()&quot;&gt;⏰ Agendar Automático&lt;/button&gt;
                    &lt;button onclick=&quot;restoreLatestBackup()&quot;&gt;↩️ Restaurar Último&lt;/button&gt;
                &lt;/div&gt;

                &lt;div id=&quot;backupResult&quot;&gt;&lt;/div&gt;

                &lt;h3 style=&quot;color: #7ec87a; margin-top: 30px; margin-bottom: 15px;&quot;&gt;📋 Backups Disponíveis&lt;/h3&gt;
                &lt;table class=&quot;table&quot;&gt;
                    &lt;thead&gt;
                        &lt;tr&gt;
                            &lt;th&gt;Data&lt;/th&gt;
                            &lt;th&gt;Projetos&lt;/th&gt;
                            &lt;th&gt;Tamanho&lt;/th&gt;
                            &lt;th&gt;Ações&lt;/th&gt;
                        &lt;/tr&gt;
                    &lt;/thead&gt;
                    &lt;tbody id=&quot;backupsList&quot;&gt;
                        &lt;tr&gt;&lt;td colspan=&quot;4&quot; style=&quot;text-align: center; color: #666;&quot;&gt;Nenhum backup&lt;/td&gt;&lt;/tr&gt;
                    &lt;/tbody&gt;
                &lt;/table&gt;
            &lt;/div&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;!-- MODAL: Novo Projeto --&gt;
    &lt;div id=&quot;newProjectModal&quot; class=&quot;modal&quot;&gt;
        &lt;div class=&quot;modal-content&quot;&gt;
            &lt;button class=&quot;modal-close&quot; onclick=&quot;closeModal('newProjectModal')&quot;&gt;✕&lt;/button&gt;
            &lt;div class=&quot;modal-title&quot;&gt;➕ Novo Projeto&lt;/div&gt;

            &lt;div class=&quot;form-group&quot;&gt;
                &lt;label&gt;Nome do Projeto&lt;/label&gt;
                &lt;input type=&quot;text&quot; id=&quot;newProjectName&quot; placeholder=&quot;ex: João Silva - Ação Trabalhista&quot;&gt;
            &lt;/div&gt;

            &lt;div class=&quot;form-group&quot;&gt;
                &lt;label&gt;Descrição (opcional)&lt;/label&gt;
                &lt;textarea id=&quot;newProjectDesc&quot; placeholder=&quot;Adicione detalhes sobre o projeto...&quot; style=&quot;min-height: 80px;&quot;&gt;&lt;/textarea&gt;
            &lt;/div&gt;

            &lt;div class=&quot;form-group&quot;&gt;
                &lt;label&gt;Tipo&lt;/label&gt;
                &lt;select id=&quot;newProjectType&quot;&gt;
                    &lt;option value=&quot;trabalhista&quot;&gt;⚖️ Trabalhista&lt;/option&gt;
                    &lt;option value=&quot;civil&quot;&gt;📋 Civil&lt;/option&gt;
                    &lt;option value=&quot;penal&quot;&gt;🔒 Penal&lt;/option&gt;
                    &lt;option value=&quot;familia&quot;&gt;👨‍👩‍👧&quot;&gt;Família&lt;/option&gt;
                    &lt;option value=&quot;administrativo&quot;&gt;📑 Administrativo&lt;/option&gt;
                    &lt;option value=&quot;outro&quot;&gt;📌 Outro&lt;/option&gt;
                &lt;/select&gt;
            &lt;/div&gt;

            &lt;div class=&quot;button-group&quot;&gt;
                &lt;button onclick=&quot;createNewProject()&quot; style=&quot;flex: 1;&quot;&gt;✅ Criar&lt;/button&gt;
                &lt;button onclick=&quot;closeModal('newProjectModal')&quot; class=&quot;danger&quot; style=&quot;flex: 1;&quot;&gt;❌ Cancelar&lt;/button&gt;
            &lt;/div&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;script&gt;
        // ═══════════════════════════════════════════════════════════════════════════════
        // STORAGE FUNCTIONS
        // ═══════════════════════════════════════════════════════════════════════════════

        const PROJECTS_KEY = &quot;juridico-projects&quot;;
        const BACKUPS_KEY = &quot;juridico-backups&quot;;
        const EXPORTS_KEY = &quot;juridico-exports&quot;;

        function loadProjects() {
            try {
                return JSON.parse(localStorage.getItem(PROJECTS_KEY) || &quot;[]&quot;);
            } catch {
                return [];
            }
        }

        function saveProjects(projects) {
            localStorage.setItem(PROJECTS_KEY, JSON.stringify(projects));
            updateProjectCount();
        }

        function loadBackups() {
            try {
                return JSON.parse(localStorage.getItem(BACKUPS_KEY) || &quot;[]&quot;);
            } catch {
                return [];
            }
        }

        function saveBackups(backups) {
            localStorage.setItem(BACKUPS_KEY, JSON.stringify(backups));
            updateBackupCount();
        }

        function loadExports() {
            try {
                return JSON.parse(localStorage.getItem(EXPORTS_KEY) || &quot;[]&quot;);
            } catch {
                return [];
            }
        }

        function saveExports(exports) {
            localStorage.setItem(EXPORTS_KEY, JSON.stringify(exports));
        }

        // ═══════════════════════════════════════════════════════════════════════════════
        // UI FUNCTIONS
        // ═══════════════════════════════════════════════════════════════════════════════

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab =&gt; {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn =&gt; {
                btn.classList.remove('active');
            });

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function showAlert(message, type = 'info', elementId = null) {
            const alertHtml = `&lt;div class=&quot;alert ${type}&quot;&gt;
                &lt;span&gt;${type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️'}&lt;/span&gt;
                &lt;div&gt;${message}&lt;/div&gt;
            &lt;/div&gt;`;

            if (elementId) {
                document.getElementById(elementId).innerHTML = alertHtml;
            }
        }

        function openModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function updateProjectCount() {
            document.getElementById('projectCount').textContent = loadProjects().length;
            updateProjectsList();
        }

        function updateBackupCount() {
            document.getElementById('backupCount').textContent = loadBackups().length;
            updateBackupsList();
        }

        // ═══════════════════════════════════════════════════════════════════════════════
        // PROJECTS
        // ═══════════════════════════════════════════════════════════════════════════════

        function showNewProjectModal() {
            openModal('newProjectModal');
        }

        function createNewProject() {
            const name = document.getElementById('newProjectName').value.trim();
            const desc = document.getElementById('newProjectDesc').value.trim();
            const type = document.getElementById('newProjectType').value;

            if (!name) {
                alert('❌ Digite o nome do projeto!');
                return;
            }

            const projects = loadProjects();
            const newProject = {
                id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
                name,
                desc,
                type,
                files: {},
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };

            projects.push(newProject);
            saveProjects(projects);
            closeModal('newProjectModal');

            document.getElementById('newProjectName').value = '';
            document.getElementById('newProjectDesc').value = '';

            showAlert(`✅ Projeto &quot;${name}&quot; criado!`, 'success', 'projectsList');
        }

        function updateProjectsList() {
            const projects = loadProjects();
            const listDiv = document.getElementById('projectsList');

            if (projects.length === 0) {
                listDiv.innerHTML = '&lt;p style=&quot;color: #888; grid-column: 1/-1; text-align: center; padding: 40px;&quot;&gt;Nenhum projeto criado&lt;/p&gt;';
                return;
            }

            listDiv.innerHTML = projects.map(p =&gt; `
                &lt;div class=&quot;file-card&quot; onclick=&quot;selectProject('${p.id}')&quot;&gt;
                    &lt;div class=&quot;file-icon&quot;&gt;📁&lt;/div&gt;
                    &lt;div class=&quot;file-name&quot;&gt;${p.name}&lt;/div&gt;
                    &lt;div class=&quot;file-info&quot;&gt;
                        &lt;div&gt;Tipo: ${p.type}&lt;/div&gt;
                        &lt;div&gt;Arquivos: ${Object.keys(p.files).length}&lt;/div&gt;
                        &lt;div style=&quot;margin-top: 8px; display: flex; gap: 5px;&quot;&gt;
                            &lt;button onclick=&quot;editProject('${p.id}'); event.stopPropagation();&quot; style=&quot;flex: 1; padding: 6px; font-size: 10px;&quot;&gt;✏️&lt;/button&gt;
                            &lt;button onclick=&quot;deleteProject('${p.id}'); event.stopPropagation();&quot; style=&quot;flex: 1; padding: 6px; font-size: 10px;&quot; class=&quot;danger&quot;&gt;🗑️&lt;/button&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;
                &lt;/div&gt;
            `).join('');
        }

        function selectProject(id) {
            console.log('Projeto selecionado:', id);
        }

        function editProject(id) {
            alert('Editar projeto: ' + id);
        }

        function deleteProject(id) {
            if (!confirm('⚠️ Deletar este projeto?')) return;

            let projects = loadProjects();
            projects = projects.filter(p =&gt; p.id !== id);
            saveProjects(projects);
            showAlert('✅ Projeto deletado!', 'success', 'projectsList');
        }

        // ═══════════════════════════════════════════════════════════════════════════════
        // EXPORT
        // ═══════════════════════════════════════════════════════════════════════════════

        function performExport() {
            const type = document.getElementById('exportType').value;
            const includeSensitive = document.getElementById('exportSensitive').value === 'true';
            const format = document.getElementById('exportFormat').value;

            const projects = loadProjects();
            let dataToExport = [];

            if (type === 'all') {
                dataToExport = projects;
            } else if (type === 'projects') {
                dataToExport = projects.map(p =&gt; ({
                    ...p,
                    files: includeSensitive ? p.files : {}
                }));
            } else if (type === 'backup') {
                dataToExport = {
                    projects,
                    backups: loadBackups(),
                    exportedAt: new Date().toISOString()
                };
            }

            let content, filename, mimeType;

            if (format === 'json') {
                content = JSON.stringify(dataToExport, null, 2);
                filename = `juridico-export-${Date.now()}.json`;
                mimeType = 'application/json';
            } else if (format === 'csv') {
                content = convertToCSV(dataToExport);
                filename = `juridico-export-${Date.now()}.csv`;
                mimeType = 'text/csv';
            } else if (format === 'sql') {
                content = convertToSQL(dataToExport);
                filename = `juridico-export-${Date.now()}.sql`;
                mimeType = 'text/sql';
            }

            downloadFile(content, filename, mimeType);

            // Salvar histórico
            const exports = loadExports();
            exports.push({
                date: new Date().toISOString(),
                type,
                format,
                filename,
                size: content.length
            });
            saveExports(exports);

            updateExportHistory();
            showAlert(`✅ Exportado: ${filename}`, 'success', 'exportResult');
        }

        function previewExport() {
            const type = document.getElementById('exportType').value;
            const projects = loadProjects();

            let preview = '';
            if (type === 'all') {
                preview = JSON.stringify(projects, null, 2).substring(0, 500) + '...';
            } else {
                preview = `Total de projetos: ${projects.length}`;
            }

            showAlert(`📋 Preview:\n${preview}`, 'info', 'exportResult');
        }

        function updateExportHistory() {
            const exports = loadExports();
            const tbody = document.getElementById('exportHistory');

            if (exports.length === 0) {
                tbody.innerHTML = '&lt;tr&gt;&lt;td colspan=&quot;4&quot; style=&quot;text-align: center; color: #666;&quot;&gt;Nenhuma exportação&lt;/td&gt;&lt;/tr&gt;';
                return;
            }

            tbody.innerHTML = exports.slice(-10).reverse().map(exp =&gt; `
                &lt;tr&gt;
                    &lt;td&gt;${new Date(exp.date).toLocaleString('pt-BR')}&lt;/td&gt;
                    &lt;td&gt;${exp.type}&lt;/td&gt;
                    &lt;td&gt;${(exp.size / 1024).toFixed(1)} KB&lt;/td&gt;
                    &lt;td&gt;&lt;button onclick=&quot;alert('${exp.filename}')&quot; style=&quot;padding: 6px 12px; font-size: 10px;&quot;&gt;📥&lt;/button&gt;&lt;/td&gt;
                &lt;/tr&gt;
            `).join('');
        }

        // ═══════════════════════════════════════════════════════════════════════════════
        // IMPORT
        // ═══════════════════════════════════════════════════════════════════════════════

        function previewImport() {
            const file = document.getElementById('importFile').files[0];
            if (!file) return;

            document.getElementById('importFileName').textContent = file.name;
            document.getElementById('importFileSize').textContent = (file.size / 1024).toFixed(1) + ' KB';
            document.getElementById('importPreview').style.display = 'block';

            const reader = new FileReader();
            reader.onload = (e) =&gt; {
                try {
                    const data = JSON.parse(e.target.result);
                    const count = Array.isArray(data) ? data.length : (data.projects ? data.projects.length : 0);
                    document.getElementById('importProjectCount').textContent = count;
                } catch {
                    document.getElementById('importProjectCount').textContent = '?';
                }
            };
            reader.readAsText(file);
        }

        function performImport() {
            const file = document.getElementById('importFile').files[0];
            if (!file) {
                showAlert('❌ Selecione um arquivo!', 'error', 'importResult');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) =&gt; {
                try {
                    const importedData = JSON.parse(e.target.result);
                    const mergeMode = document.getElementById('importMerge').value;
                    let projects = loadProjects();

                    const toImport = Array.isArray(importedData) ? importedData : importedData.projects || [];

                    if (mergeMode === 'replace') {
                        projects = toImport;
                    } else if (mergeMode === 'merge') {
                        for (const imported of toImport) {
                            const existing = projects.find(p =&gt; p.id === imported.id);
                            if (existing) {
                                Object.assign(existing, imported);
                            } else {
                                projects.push(imported);
                            }
                        }
                    } else if (mergeMode === 'rename') {
                        for (const imported of toImport) {
                            imported.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
                            imported.name += ` (importado ${new Date().toLocaleDateString('pt-BR')})`;
                            projects.push(imported);
                        }
                    }

                    saveProjects(projects);
                    cancelImport();
                    showAlert(`✅ ${toImport.length} projeto(s) importado(s)!`, 'success', 'importResult');
                } catch (err) {
                    showAlert(`❌ Erro ao importar: ${err.message}`, 'error', 'importResult');
                }
            };
            reader.readAsText(file);
        }

        function cancelImport() {
            document.getElementById('importFile').value = '';
            document.getElementById('importPreview').style.display = 'none';
            document.getElementById('importResult').innerHTML = '';
        }

        function loadExampleProject() {
            const example = {
                id: 'example-1',
                name: 'João Silva - Ação Trabalhista',
                desc: 'Projeto de exemplo para teste',
                type: 'trabalhista',
                files: {
                    'contrato.txt': 'Conteúdo do contrato...',
                    'parecer.txt': 'Parecer jurídico...'
                },
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };

            const blob = new Blob([JSON.stringify([example], null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'exemplo-projeto.json';
            a.click();
        }

        function loadExampleBackup() {
            const example = {
                projects: [
                    {
                        id: 'ex-1',
                        name: 'Exemplo 1',
                        type: 'civil',
                        files: {},
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    }
                ],
                backups: [],
                exportedAt: new Date().toISOString()
            };

            const blob = new Blob([JSON.stringify(example, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'exemplo-backup.json';
            a.click();
        }

        function loadExampleBatch() {
            const examples = [
                { id: 'ex-1', name: 'Cliente 1', type: 'trabalhista', files: {}, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() },
                { id: 'ex-2', name: 'Cliente 2', type: 'civil', files: {}, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() },
                { id: 'ex-3', name: 'Cliente 3', type: 'penal', files: {}, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }
            ];

            const blob = new Blob([JSON.stringify(examples, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'exemplo-lote.json';
            a.click();
        }

        // ═══════════════════════════════════════════════════════════════════════════════
        // BACKUPS
        // ═══════════════════════════════════════════════════════════════════════════════

        function createBackup() {
            const projects = loadProjects();
            const backups = loadBackups();

            const backup = {
                id: Date.now().toString(36),
                date: new Date().toISOString(),
                projectCount: projects.length,
                projects: JSON.parse(JSON.stringify(projects))
            };

            backups.push(backup);
            saveBackups(backups);
            showAlert(`✅ Backup criado! (${projects.length} projetos)`, 'success', 'backupResult');
        }

        function scheduleAutoBackup() {
            const interval = prompt('Criar backup a cada quantos minutos? (mín: 5)', '60');
            if (!interval) return;

            const mins = Math.max(5, parseInt(interval) || 60);
            localStorage.setItem('backup-interval', mins.toString());
            showAlert(`✅ Backup agendado a cada ${mins} minutos`, 'success', 'backupResult');
        }

        function restoreLatestBackup() {
            const backups = loadBackups();
            if (backups.length === 0) {
                showAlert('❌ Nenhum backup disponível', 'error', 'backupResult');
                return;
            }

            const latest = backups[backups.length - 1];
            if (!confirm(`Restaurar backup de ${new Date(latest.date).toLocaleString('pt-BR')}?`)) return;

            saveProjects(latest.projects);
            showAlert(`✅ Backup restaurado! (${latest.projectCount} projetos)`, 'success', 'backupResult');
        }

        function updateBackupsList() {
            const backups = loadBackups();
            const tbody = document.getElementById('backupsList');

            if (backups.length === 0) {
                tbody.innerHTML = '&lt;tr&gt;&lt;td colspan=&quot;4&quot; style=&quot;text-align: center; color: #666;&quot;&gt;Nenhum backup&lt;/td&gt;&lt;/tr&gt;';
                return;
            }

            tbody.innerHTML = backups.map(b =&gt; `
                &lt;tr&gt;
                    &lt;td&gt;${new Date(b.date).toLocaleString('pt-BR')}&lt;/td&gt;
                    &lt;td&gt;${b.projectCount}&lt;/td&gt;
                    &lt;td&gt;${(JSON.stringify(b).length / 1024).toFixed(1)} KB&lt;/td&gt;
                    &lt;td&gt;
                        &lt;button onclick=&quot;restoreBackup('${b.id}')&quot; style=&quot;padding: 6px 12px; font-size: 10px;&quot;&gt;↩️&lt;/button&gt;
                        &lt;button onclick=&quot;deleteBackup('${b.id}')&quot; style=&quot;padding: 6px 12px; font-size: 10px;&quot; class=&quot;danger&quot;&gt;🗑️&lt;/button&gt;
                    &lt;/td&gt;
                &lt;/tr&gt;
            `).join('');
        }

        function restoreBackup(id) {
            const backups = loadBackups();
            const backup = backups.find(b =&gt; b.id === id);
            if (!backup) return;

            if (!confirm(`Restaurar backup de ${new Date(backup.date).toLocaleString('pt-BR')}?`)) return;

            saveProjects(backup.projects);
            showAlert(`✅ Backup restaurado!`, 'success', 'backupResult');
        }

        function deleteBackup(id) {
            if (!confirm('⚠️ Deletar este backup?')) return;

            let backups = loadBackups();
            backups = backups.filter(b =&gt; b.id !== id);
            saveBackups(backups);
            showAlert('✅ Backup deletado!', 'success', 'backupResult');
        }

        // ═══════════════════════════════════════════════════════════════════════════════
        // UTILITIES
        // ═══════════════════════════════════════════════════════════════════════════════

        function downloadFile(content, filename, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function convertToCSV(data) {
            if (!Array.isArray(data)) return '';
            const headers = ['ID', 'Nome', 'Tipo', 'Arquivos', 'Criado'];
            const rows = data.map(p =&gt; [p.id, p.name, p.type, Object.keys(p.files).length, p.createdAt]);
            return [headers, ...rows].map(r =&gt; r.map(c =&gt; `&quot;${c}&quot;`).join(',')).join('\n');
        }

        function convertToSQL(data) {
            if (!Array.isArray(data)) return '';
            let sql = 'CREATE TABLE IF NOT EXISTS projetos (id TEXT PRIMARY KEY, nome TEXT, tipo TEXT, criado_em DATETIME);\n\n';
            for (const p of data) {
                sql += `INSERT INTO projetos VALUES ('${p.id}', '${p.name.replace(/'/g, &quot;''&quot;)}', '${p.type}', '${p.createdAt}');\n`;
            }
            return sql;
        }

        // ═══════════════════════════════════════════════════════════════════════════════
        // INIT
        // ═══════════════════════════════════════════════════════════════════════════════

        window.addEventListener('load', () =&gt; {
            updateProjectCount();
            updateBackupCount();
            updateExportHistory();
            updateBackupsList();
        });
    &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>

            font-weight: bold;
        }

        .status-badge.error {
            background: #3a1a1a;
            border-color: #5a2d2d;
            color: #ff6b6b;
        }
    &lt;/style&gt;
&lt;/head&gt;

                        &lt;h3 style=&quot;color: #7ec87a; margin-bottom: 10px;&quot;&gt;📖 Informações&lt;/h3&gt;
                        
                        &lt;p style=&quot;color: #888; font-size: 12px; line-height: 1.8; margin-bottom: 15px;&quot;&gt;
                            &lt;strong&gt;SK Editor Pro&lt;/strong&gt; é um editor de código integrado com GitHub, Deploy e Backup.&lt;br&gt;&lt;br&gt;
                            &lt;strong&gt;Funcionalidades:&lt;/strong&gt;&lt;br&gt;
                            ✅ Conectar ao GitHub com token pessoal&lt;br&gt;
                            ✅ Criar e atualizar repositórios&lt;br&gt;
                            ✅ Clonar repositórios públicos&lt;br&gt;
                            ✅ Publicar no GitHub Pages&lt;br&gt;
                            ✅ Gerenciar arquivos&lt;br&gt;
                            ✅ Fazer backup e restaurar&lt;br&gt;
                            ✅ Deploy em múltiplas plataformas&lt;br&gt;&lt;br&gt;
                            &lt;strong&gt;Segurança:&lt;/strong&gt;&lt;br&gt;
                            • Token salvo apenas no navegador (localStorage)&lt;br&gt;
                            • Nunca enviado para servidor&lt;br&gt;
                            • Você pode revogar o token no GitHub a qualquer hora&lt;br&gt;
                        &lt;/p&gt;

                        &lt;div class=&quot;alert info&quot;&gt;
                            &lt;span&gt;💡&lt;/span&gt;
                            &lt;div&gt;
                                &lt;strong&gt;Dica:&lt;/strong&gt; Use o Terminal (🖥️) para executar comandos Git diretamente. O app suporta git real do seu computador.
